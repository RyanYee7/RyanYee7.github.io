        <body>
            <div class="newsletter-container">

                        <li><label for="city">City:</label> <input type="text" name="city" id="city" placeholder="city" /></li>
                        <li>

                                <option value="NE">Nebraska</option>
                                <option value="NV">Nevada</option>
                                <option value="NH">New Hampshire</option>
                                <option value="NJ">New Jersey</option>
                                <option value="NM">New Mexico</option>
                                <option value="NY">New York</option>
                                <option value="NC">North Carolina</option>

                                <option value="OH">Ohio</option>

                                <option value="RI">Rhode Island</option>
                                <option value="SC">South Carolina</option>
                                <option value="SD">South Dakota</option>

                        <li><label for="street-address">Zip code:</label> <input type="text" name="zip-code" id="zip-code" placeholder="zip code" /></li>
                        <li><label for="email">Email:</label> <input type="email" name="email" id="email" placeholder="confirmation email" /></li>
                        <li><label for="phone">Phone:</label> <input type="tel" name="phone" id="phone" placeholder="your phone number" /></li>
                    </ul>
                </section>

                <section class="order">

                    <h2>What would you like to be updated about?</h2>
                    
                    <ul>
                        <li><input type="checkbox" id="surfer-profiles" value="surfer-profiles" /> <label for="surfer-profiles">New professional surfer profiles</label></li>
                        <li><input type="checkbox" id="results" value="results" /> <label for="results">Major surf competition results</label></li>
                        <li><input type="checkbox" id="swell" value="swell" /> <label for="swell">Ocean conditions and major swell alerts</label></li>
                        <li><input type="checkbox" id="events" value="events" /> <label for="events">Upcoming surf events and contest </label></li>
                        <li><input type="checkbox" id="galleries" value="galleries" /> <label for="galleries">New photo galleries from recent swells</label></li>
                        <li><input type="checkbox" id="gear" value="gear" /> <label for="gear">Surfboard and gear recommendations</label></li>
                        <li><input type="checkbox" id="discounts" value="discounts" /> <label for="discounts">Surfboard and gear discounts</label></li>
                        <li><input type="checkbox" id="camp" value="camp" /> <label for="camp">Surf camp information</label></li>
                    </ul>
                </section>
                <section  class="method">
                    <h2>How would you like to be notified?</h2>
                    <ul>
                        <li><input type="radio" id="email" value="email" name="method" /> <label for="email">Email</label></li>
                        <li><input type="radio" id="text-message" value="text-message" name="method" /> <label for="text-message">Text Message</label></li>
                    </ul>
                </section>
                <section><label for="notes">Please let us know if you have any special requests or recommendations.</label><textarea id="notes" name="notes"></textarea></section>
                <section>
                    <button type="subscribe">Subscribe</button>
                </section>
            </form>
